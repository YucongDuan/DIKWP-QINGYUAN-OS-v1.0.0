name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: PYTHONPATH=src python -m unittest discover -s tests -v
      - run: PYTHONPATH=src python -m qingyuan_os suite --examples examples --output outputs/reference
      - run: python scripts/build_zipapp.py
      - run: python dist/DIKWP_QINGYUAN_OS.pyz inspect
