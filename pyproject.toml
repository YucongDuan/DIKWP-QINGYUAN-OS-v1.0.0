[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dikwp-qingyuan-os"
version = "1.0.0"
description = "Evidence-return and manipulation-circuit-breaking runtime with rights-preserving review"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "AGPL-3.0-or-later"}
authors = [{name = "Yucong Duan"}]
dependencies = []
keywords = ["DIKWP", "misinformation", "manipulation", "media literacy", "provenance", "appeal", "AI governance"]

[project.scripts]
dikwp-qingyuan = "qingyuan_os.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
qingyuan_os = ["data/examples/*.json"]
